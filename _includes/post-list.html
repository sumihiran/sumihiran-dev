{%- assign posts = include.posts -%}
{%- if posts.size > 0 %}
<ul class="posts">
  {%- for post in posts %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%a %d %b %Y" }}</time>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {%- endfor %}
</ul>
{%- else %}
<p class="meta">Nothing here yet.</p>
{%- endif %}
